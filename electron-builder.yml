{
  "appId": "com.pi.agent.app",
  "productName": "Pi Agent App",
  "directories": {
    "output": "release",
    "buildResources": "build"
  },
  "files": [
    "out/**",
    "package.json",
    "!**/*.map",
    "!**/*.d.ts",
    "!node_modules/@earendil-works/pi-coding-agent/node_modules/**",
    "!node_modules/@earendil-works/pi-coding-agent/docs/**",
    "!node_modules/@earendil-works/pi-coding-agent/examples/**",
    "!node_modules/@earendil-works/pi-coding-agent/CHANGELOG.md",
    "!node_modules/@mariozechner/clipboard-darwin-*",
    "!node_modules/@mariozechner/clipboard-linux*",
    "!node_modules/**/{README,README.*,CHANGELOG,CHANGELOG.*,HISTORY,LICENSE,LICENCE}*"
  ],
  "electronLanguages": [
    "zh-CN",
    "en-US"
  ],
  "compression": "maximum",
  "asarUnpack": [
    "node_modules/node-pty/**"
  ],
  "win": {
    "icon": "build/icon.ico",
    "target": [
      {
        "target": "dir",
        "arch": ["x64"]
      }
    ]
  },
  "npmRebuild": false
}
